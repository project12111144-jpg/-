<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پارۂ تشنگی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Mirza:wght@400;500;700&family=Caveat:wght@400;500;600;700&display=swap');

:root{
  --bg1:#070A10; --bg2:#0C121C; --bg3:#050709;
  --gold:#CDA34E; --gold-lt:#EFD9A0; --gold-dim:#7C6132; --gold-line:rgba(205,163,78,0.35);
  --card-blue-a:#173254; --card-blue-b:#0A1826;
  --card-green-a:#144230; --card-green-b:#08190F;
  --ink:#EDE3CC; --ink-dim:#B9AC8B;
  --panel:#111823; --panel-2:#0B121B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:'Kalam', cursive;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(205,163,78,0.08), transparent 45%),
    radial-gradient(circle at 15% 20%, rgba(205,163,78,0.05), transparent 30%),
    radial-gradient(circle at 85% 75%, rgba(205,163,78,0.04), transparent 35%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 55%, var(--bg3) 100%);
  min-height:100vh; overflow-x:hidden;
}
.dust{position:fixed; inset:0; pointer-events:none; z-index:1; opacity:0.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(205,163,78,0.5), transparent),
    radial-gradient(1px 1px at 70% 15%, rgba(205,163,78,0.4), transparent),
    radial-gradient(1px 1px at 85% 55%, rgba(205,163,78,0.35), transparent),
    radial-gradient(1px 1px at 35% 70%, rgba(205,163,78,0.3), transparent),
    radial-gradient(1px 1px at 55% 40%, rgba(205,163,78,0.4), transparent),
    radial-gradient(1px 1px at 10% 85%, rgba(205,163,78,0.3), transparent);
  background-size:300px 300px;
}

#app{position:relative; width:100%; min-height:100vh; z-index:2;}
.screen{display:none; min-height:100vh; padding:20px 16px 40px; max-width:520px; margin:0 auto;}
.screen.active{display:block;}

.gear{
  position:fixed; top:18px; right:18px; z-index:20; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--gold-line); background:rgba(13,18,26,0.6); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gold);
}

.ornament{display:flex; align-items:center; justify-content:center; gap:10px; color:var(--gold-dim); margin:14px 0;}
.ornament .ln{width:26px; height:1px; background:linear-gradient(90deg, transparent, var(--gold-line));}
.ornament .ln.r{background:linear-gradient(90deg, var(--gold-line), transparent);}
.ornament .dot{font-size:10px; color:var(--gold);}

/* ---------- HOME ---------- */
.emblem-wrap{margin-top:26px;}
.author-name{
  font-family:'Mirza', serif; direction:rtl; font-size:17px; color:var(--gold);
  text-align:center; letter-spacing:1px; opacity:0.9; margin-top:2px;
}
.author-name.hi{font-family:'Kalam', cursive; direction:ltr; font-size:15px;}

.section-heading{
  text-align:center; font-family:'Mirza', serif; direction:rtl; color:var(--gold);
  font-size:20px; margin-top:34px;
}

.preview-row{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px;
}
.pcard{
  position:relative; aspect-ratio:3/4; border-radius:14px; overflow:hidden; cursor:pointer;
  border:1px solid var(--gold-line); box-shadow:0 10px 24px rgba(0,0,0,0.4);
  display:flex; align-items:flex-end;
}
.pcard .bgfx{position:absolute; inset:0;}
.pcard .fade{position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(4,6,9,0.85) 100%);}
.pcard .txt{position:relative; z-index:2; padding:10px 6px 8px; width:100%; text-align:center;}
.pcard .matla{font-family:'Mirza', serif; direction:rtl; font-size:12.5px; color:var(--ink); line-height:1.45;}
.pcard .num{margin-top:5px; font-family:'Caveat', cursive; color:var(--gold); font-size:13px; letter-spacing:1px;}
.pcard.empty{align-items:center; justify-content:center; cursor:default;}
.pcard.empty .txt{text-align:center; color:var(--gold-dim); font-family:'Kalam', cursive; font-size:13px;}

.cta-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:30px;}
.cta{
  border-radius:16px; padding:26px 12px 20px; text-align:center; cursor:pointer;
  border:1px solid var(--gold-line); box-shadow:0 14px 30px rgba(0,0,0,0.45);
}
.cta.blue{background:linear-gradient(150deg, var(--card-blue-a), var(--card-blue-b));}
.cta.green{background:linear-gradient(150deg, var(--card-green-a), var(--card-green-b));}
.cta svg{width:32px; height:32px; margin-bottom:10px;}
.cta .en{font-family:'Caveat', cursive; letter-spacing:1px; font-size:20px; color:var(--gold-lt); text-transform:uppercase;}
.cta .ur{font-family:'Mirza', serif; direction:rtl; color:var(--gold); font-size:17px; margin-top:4px;}

.desk{
  margin-top:44px; margin-left:-16px; margin-right:-16px; overflow:hidden;
  border-top:1px solid rgba(205,163,78,0.15);
}
.desk img{width:100%; display:block;}

/* ---------- PANEL ---------- */
.panel-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.icon-btn{
  background:rgba(205,163,78,0.08); border:1px solid var(--gold-line); cursor:pointer; color:var(--gold);
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px;
}
.panel-title{font-family:'Mirza', serif; direction:rtl; color:var(--gold); font-size:20px;}
.script-toggle{display:flex; gap:4px; background:rgba(205,163,78,0.08); border:1px solid var(--gold-line); border-radius:20px; padding:3px;}
.script-toggle button{border:none; background:none; cursor:pointer; padding:6px 13px; border-radius:16px; color:var(--ink-dim); font-family:'Kalam', cursive; font-size:12.5px;}
.script-toggle button.on{background:var(--gold-dim); color:var(--bg1);}

.fehrist-item{
  display:flex; align-items:baseline; gap:12px; padding:16px 4px; border-bottom:1px solid rgba(205,163,78,0.12);
  cursor:pointer;
}
.fehrist-num{color:var(--gold); font-size:16px; min-width:22px; font-family:'Caveat', cursive;}
.fehrist-matla{flex:1; font-size:17px; line-height:1.5; color:var(--ink); font-family:'Kalam', cursive;}
.fehrist-matla.ur{font-family:'Mirza', serif; direction:rtl; text-align:right; font-size:19px;}
.fehrist-star{color:var(--gold); font-size:15px; opacity:0.85;}
.empty-state{text-align:center; padding:60px 10px; color:var(--ink-dim); font-family:'Kalam', cursive; font-size:15px;}

.reader-card{
  border-radius:14px; border:1px solid var(--gold-line); background:linear-gradient(160deg, var(--panel), var(--panel-2));
  padding:28px 20px; min-height:40vh; position:relative;
}
.ghazal-title{font-size:20px; text-align:center; margin:0 0 20px; color:var(--gold-lt);}
.ghazal-title.ur{font-family:'Mirza', serif; direction:rtl; font-size:26px;}
.ghazal-title.hi{font-family:'Kalam', cursive; font-weight:700;}
.ghazal-body{white-space:pre-wrap; text-align:center; font-size:19px; line-height:2.1; color:var(--ink);}
.ghazal-body.ur{font-family:'Mirza', serif; direction:rtl; font-size:23px; line-height:2.25;}
.ghazal-body.hi{font-family:'Kalam', cursive;}

.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.nav-arrow{
  background:rgba(205,163,78,0.08); border:1px solid var(--gold-line); cursor:pointer; color:var(--gold);
  width:40px; height:40px; border-radius:50%; font-size:18px;
}
.nav-arrow[disabled]{opacity:0.2; pointer-events:none;}
.fav-btn{background:none; border:none; cursor:pointer; color:var(--gold); font-size:20px;}

/* ---------- COMMENTS ---------- */
.comments-block{margin-top:22px;}
.comments-heading{font-family:'Mirza', serif; direction:rtl; color:var(--gold); font-size:16px; margin-bottom:10px; text-align:center;}
.comment-item{padding:12px 4px; border-bottom:1px solid rgba(205,163,78,0.1);}
.comment-name{font-family:'Caveat', cursive; font-size:17px; color:var(--gold); margin-bottom:3px;}
.comment-text{font-family:'Kalam', cursive; font-size:14.5px; color:var(--ink-dim); line-height:1.6;}
.comment-form{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.comment-form input, .comment-form textarea{
  width:100%; border:1px solid rgba(205,163,78,0.25); background:rgba(255,255,255,0.03);
  font-family:'Kalam', cursive; font-size:14.5px; color:var(--ink); padding:9px 10px; border-radius:6px; outline:none; resize:vertical;
}
.comment-form textarea{min-height:64px;}
.comment-form input:focus, .comment-form textarea:focus{border-color:var(--gold);}
.comment-submit{
  align-self:flex-end; background:linear-gradient(150deg,#2a1f0e,#171008); color:var(--gold-lt);
  border:1px solid var(--gold-line); border-radius:8px; padding:8px 18px; font-family:'Kalam', cursive; font-size:13.5px; cursor:pointer;
}
.no-comments{text-align:center; color:var(--ink-dim); font-family:'Kalam', cursive; font-size:13px; padding:10px 0; opacity:0.7;}

/* ---------- SETTINGS ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(4,6,9,0.7); z-index:30; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-overlay.active{display:flex;}
.modal{width:100%; max-width:400px; background:linear-gradient(160deg,var(--panel),var(--panel-2)); border:1px solid var(--gold-line); border-radius:14px; padding:22px;}
.modal h3{font-family:'Mirza', serif; direction:rtl; color:var(--gold); margin:0 0 14px; font-size:19px;}
.field-label{font-family:'Kalam', cursive; font-size:13px; color:var(--ink-dim); margin:16px 0 6px; letter-spacing:0.5px;}
.field-label:first-child{margin-top:0;}
input[type=text]{
  width:100%; border:none; border-bottom:1px solid rgba(205,163,78,0.25); background:rgba(255,255,255,0.02);
  font-family:'Kalam', cursive; font-size:16px; color:var(--ink); padding:10px 8px; outline:none; border-radius:4px 4px 0 0;
}
input[type=text]:focus{border-bottom-color:var(--gold);}
input.ur{font-family:'Mirza', serif; direction:rtl; font-size:19px;}
.editor-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px;}
.btn{font-family:'Kalam', cursive; font-size:14px; padding:11px 20px; border-radius:8px; cursor:pointer; border:1px solid var(--gold-line);}
.btn-primary{background:linear-gradient(150deg,#2a1f0e,#171008); color:var(--gold-lt);}
.btn-ghost{background:transparent; color:var(--ink-dim);}
</style>

  <div id="indexPage" class="screen">

    <h3>شاعر کا نام</h3>

    <input type="text" id="setAuthorHi" placeholder="जैसे — नूर आलम इदरीसी">
    <div class="field-label">اردو میں نام</div>
    <input type="text" id="setAuthorUr" class="ur" placeholder="مثلاً — نور عالم ادریسی">
    <div class="editor-actions">
      <button class="btn btn-primary" onclick="saveAuthor()">सहेजें</button>
      <button class="btn btn-ghost" onclick="closeSettings()">बंद करें</button>
    </div>

<script>
/* Interface preview — 2 sample ghazals so the design can be judged.
   No in-app writing system. Send real ghazal texts any time to swap these in. */
const GHAZALS = [
  { id:1,
    titleHi:'यह एक नमूना है', titleUr:'یہ ایک نمونہ ہے',
    bodyHi:`दिल की बात लबों तक आते आते रुक गई\nशायद यही मोहब्बत की रीत है\n\nतेरे बिना ये शामें सूनी सूनी लगती हैं\nयही तो उल्फ़त की सबसे बड़ी जीत है`,
    bodyUr:`دل کی بات لبوں تک آتے آتے رک گئی\nشاید یہی محبت کی ریت ہے` },
  { id:2,
    titleHi:'दूसरा नमूना', titleUr:'دوسرا نمونہ',
    bodyHi:`ख़्वाबों में तेरा आना अब आदत सी हो गई\nजागते ही बिखर जाना भी आदत सी हो गई`,
    bodyUr:`` },
  { id:3,
    titleHi:'तीसरा नमूना', titleUr:'تیسرا نمونہ',
    bodyHi:`चराग़ों से भी उजाला नहीं होता\nजब तक दिल का अंधेरा नहीं जाता`,
    bodyUr:`چراغوں سے بھی اجالا نہیں ہوتا\nجب تک دل کا اندھیرا نہیں جاتا` },
  { id:4,
    titleHi:'चौथा नमूना', titleUr:'چوتھا نمونہ',
    bodyHi:`बारिश में भीगते हुए याद आया वो\nजो कभी छत पर साथ खड़ा होता था`,
    bodyUr:`` }
];

let favorites = [];
let comments = {};
let currentScript = 'hi';
let currentIndex = 0;
let indexFilter = 'all';
let author = {hi:'', ur:''};

const AKEY = 'author-name';
const FKEY = 'favorites';
const CKEY = 'comments-data';

async function loadData(){
  try{ const r = await window.storage.get(AKEY, true); author = r ? JSON.parse(r.value) : {hi:'',ur:''}; }catch(e){ author = {hi:'',ur:''}; }
  try{ const r = await window.storage.get(FKEY, false); favorites = r ? JSON.parse(r.value) : []; }catch(e){ favorites = []; }
  try{ const r = await window.storage.get(CKEY, true); comments = r ? JSON.parse(r.value) : {}; }catch(e){ comments = {}; }
  renderAuthor();
}
async function saveAuthorData(){ try{ await window.storage.set(AKEY, JSON.stringify(author), true); }catch(e){} }
async function saveFavorites(){ try{ await window.storage.set(FKEY, JSON.stringify(favorites), false); }catch(e){} }
async function saveComments(){ try{ await window.storage.set(CKEY, JSON.stringify(comments), true); }catch(e){} }

function renderAuthor(){
  document.getElementById('authorHi').textContent = author.hi || '— शायर का नाम —';
  document.getElementById('authorUr').textContent = author.ur || '— نام شاعر —';
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){ renderPreview(); showScreen('home'); }
function openSettings(){
  document.getElementById('setAuthorHi').value = author.hi || '';
  document.getElementById('setAuthorUr').value = author.ur || '';
  document.getElementById('settingsModal').classList.add('active');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('active'); }
async function saveAuthor(){
  author.hi = document.getElementById('setAuthorHi').value.trim();
  author.ur = document.getElementById('setAuthorUr').value.trim();
  await saveAuthorData(); renderAuthor(); closeSettings();
}

const THEMES = ['bg-moon','bg-lantern','bg-quill','bg-rain'];
function themeMarkup(theme){ return ''; }

function ghazalDisplayTitle(g){
  if(currentScript==='ur' && g.titleUr) return {text:g.titleUr, lang:'ur'};
  if(currentScript==='hi' && g.titleHi) return {text:g.titleHi, lang:'hi'};
  if(g.titleHi) return {text:g.titleHi, lang:'hi'};
  if(g.titleUr) return {text:g.titleUr, lang:'ur'};
  const body = g.bodyHi || g.bodyUr || '';
  const lang = g.bodyHi ? 'hi' : 'ur';
  return {text:(body.split('\\n')[0]||'بے نام').slice(0,40), lang};
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderPreview(){
  const row = document.getElementById('previewRow');
  const items = GHAZALS.slice(0,4);
  if(items.length===0){
    row.innerHTML = `<div class="pcard empty ${THEMES[0]}"><div class="txt">جلد آرہا ہے</div></div>
      <div class="pcard empty ${THEMES[1]}"><div class="txt">जल्द ही</div></div>`;
    return;
  }
  row.innerHTML = items.map((g,i)=>{
    const theme = THEMES[i % THEMES.length];
    const d = ghazalDisplayTitle(g);
    const realIndex = GHAZALS.indexOf(g);
    return `<div class="pcard ${theme}" onclick="openFromHome(${realIndex})">
      <div class="bgfx">${themeMarkup(theme)}</div>
      <div class="fade"></div>
      <div class="txt"><div class="matla" dir="rtl">${escapeHtml(d.text)}</div><div class="num">${String(i+1).padStart(2,'0')}</div></div>
    </div>`;
  }).join('');
}
function openFromHome(i){ currentIndex=i; renderReader(); showScreen('reader'); }
function goRead(){ indexFilter='all'; renderIndex(); showScreen('indexPage'); document.getElementById('indexHeading').textContent='فہرست'; }
function goSaved(){ indexFilter='saved'; renderIndex(); showScreen('indexPage'); document.getElementById('indexHeading').textContent='محفوظ شدہ'; }

function setScript(s){
  currentScript = s;
  document.getElementById('tgHi').classList.toggle('on', s==='hi');
  document.getElementById('tgUr').classList.toggle('on', s==='ur');
  renderIndex(); renderPreview();
  if(document.getElementById('reader').classList.contains('active')) renderReader();
}

function renderIndex(){
  const list = document.getElementById('indexList');
  let items = GHAZALS.map((g,i)=>({g,i})).filter(o=> indexFilter==='saved' ? favorites.includes(o.g.id) : true);
  if(items.length===0){
    list.innerHTML = `<div class="empty-state">${indexFilter==='saved' ? 'अभी आपने कोई ग़ज़ल सहेजी नहीं है।' : 'ग़ज़लें जल्द जोड़ी जाएँगी।'}</div>`;
  } else {
    list.innerHTML = items.map((o,n)=>{
      const d = ghazalDisplayTitle(o.g);
      return `<div class="fehrist-item" onclick="openGhazal(${o.i})">
        <span class="fehrist-num">${n+1}</span>
        <span class="fehrist-matla ${d.lang}">${escapeHtml(d.text)}</span>
        ${favorites.includes(o.g.id) ? '<span class="fehrist-star">★</span>' : ''}
      </div>`;
    }).join('');
  }
}
function openGhazal(i){ currentIndex=i; renderReader(); showScreen('reader'); }
function backFromReader(){ renderIndex(); showScreen('indexPage'); }

function renderReader(){
  const g = GHAZALS[currentIndex]; if(!g) return;
  const useUr = currentScript==='ur' && g.bodyUr;
  const body = useUr ? g.bodyUr : (g.bodyHi || g.bodyUr || '');
  const lang = useUr ? 'ur' : (g.bodyHi ? 'hi':'ur');
  const t = ghazalDisplayTitle(g);
  document.getElementById('readerCounter').textContent = `${currentIndex+1} / ${GHAZALS.length}`;
  document.getElementById('readerContent').innerHTML = `
    <div class="ghazal-title ${t.lang}">${escapeHtml(t.text)}</div>
    <div class="ghazal-body ${lang}">${escapeHtml(body)}</div>`;
  document.getElementById('prevArrow').disabled = currentIndex===0;
  document.getElementById('nextArrow').disabled = currentIndex===GHAZALS.length-1;
  document.getElementById('favBtn').textContent = favorites.includes(g.id) ? '★' : '☆';
  renderComments();
}
function navGhazal(dir){ const ni=currentIndex+dir; if(ni<0||ni>=GHAZALS.length) return; currentIndex=ni; renderReader(); }
async function toggleFav(){
  const g = GHAZALS[currentIndex]; if(!g) return;
  const idx = favorites.indexOf(g.id);
  if(idx>=0) favorites.splice(idx,1); else favorites.push(g.id);
  await saveFavorites(); renderReader();
}

function renderComments(){
  const g = GHAZALS[currentIndex]; if(!g) return;
  const list = comments[g.id] || [];
  const el = document.getElementById('commentsList');
  el.innerHTML = list.length===0
    ? '<div class="no-comments">अभी कोई तबसरा नहीं — पहली राय आप दें।</div>'
    : list.map(c=>`<div class="comment-item"><div class="comment-name">${escapeHtml(c.name)}</div><div class="comment-text">${escapeHtml(c.text)}</div></div>`).join('');
  document.getElementById('cName').value=''; document.getElementById('cText').value='';
}
async function postComment(){
  const g = GHAZALS[currentIndex]; if(!g) return;
  const name = document.getElementById('cName').value.trim() || 'बेनाम';
  const text = document.getElementById('cText').value.trim();
  if(!text){ alert('कृपया कुछ लिखें।'); return; }
  if(!comments[g.id]) comments[g.id] = [];
  comments[g.id].push({name, text, ts:Date.now()});
  await saveComments(); renderComments();
}

(async function init(){
  await loadData();
  setScript('hi');
  renderPreview();
})();
</script>
</body>
