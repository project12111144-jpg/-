<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para-e-Tishnagi — Sign Up</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Mirza:wght@700&family=Caveat:wght@600;700&display=swap');

:root{
  --bg1:#070A10; --bg2:#0C121C; --bg3:#050709;
  --gold:#CDA34E; --gold-lt:#EFD9A0; --gold-line:rgba(205,163,78,0.35);
  --ink:#EDE3CC; --ink-dim:#B9AC8B;
  --panel:#111823; --panel-2:#0B121B;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; min-height:100%;}
body{
  font-family:'Kalam', cursive; color:var(--ink);
  background:linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 55%, var(--bg3) 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.wrap{width:100%; max-width:400px;}
.title{text-align:center; font-family:'Mirza', serif; direction:rtl; color:var(--gold); font-size:30px; margin-bottom:24px;}
.screen{display:none;}
.screen.active{display:block;}
.card{
  border-radius:14px; border:1px solid var(--gold-line);
  background:linear-gradient(160deg, var(--panel), var(--panel-2));
  padding:26px 22px; box-shadow:0 14px 34px rgba(0,0,0,0.45);
}
.field-label{font-family:'Kalam', cursive; font-size:13px; color:var(--ink-dim); margin:14px 0 6px;}
.field-label:first-child{margin-top:0;}
input[type=text], input[type=password]{
  width:100%; border:1px solid rgba(205,163,78,0.25); background:rgba(255,255,255,0.03);
  font-family:'Kalam', cursive; font-size:16px; color:var(--ink); padding:11px 10px; border-radius:8px; outline:none;
}
input:focus{border-color:var(--gold);}
.btn{width:100%; font-family:'Kalam', cursive; font-size:15px; padding:12px 20px; border-radius:8px; cursor:pointer; border:1px solid var(--gold-line); margin-top:18px;}
.btn-primary{background:linear-gradient(150deg,#2a1f0e,#171008); color:var(--gold-lt);}
.or-divider{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-dim); font-size:12px;}
.or-divider::before, .or-divider::after{content:''; flex:1; height:1px; background:rgba(205,163,78,0.25);}
.btn-google{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#fff; color:#3c4043; border:1px solid #dadce0; border-radius:8px; padding:11px 16px;
  font-family:'Kalam', cursive; font-size:14px; cursor:pointer;
}
.note{text-align:center; font-size:13px; color:var(--ink-dim); margin-top:16px;}
.note a{color:var(--gold); cursor:pointer; text-decoration:underline;}
.status{text-align:center; font-size:13px; color:var(--ink-dim); margin-top:14px; min-height:18px;}
.status.ok{color:#6FCF97;}
.status.err{color:#E08585;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">پارۂ تشنگی</div>

  <div id="signup" class="screen active">
    <div class="card">
      <div class="field-label">Your name</div>
      <input type="text" id="suName" placeholder="e.g. Noor Alam">
      <div class="field-label">Email</div>
      <input type="text" id="suEmail" placeholder="you@example.com">
      <div class="field-label">Password</div>
      <input type="password" id="suPass" placeholder="At least 6 characters">
      <div class="field-label">Confirm password</div>
      <input type="password" id="suPass2" placeholder="Re-enter password">

      <button class="btn btn-primary" onclick="handleSignup()">Create Account</button>
      <div class="or-divider">or</div>
      <button class="btn-google" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.6-.2-3.1-.9-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.6 26.9 37.5 24 37.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 41 16.2 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.6 5.4c-.5.4 7.4-5.4 7.4-16.5 0-1.6-.2-3.1-.9-4.5z"/></svg>
        Continue with Google
      </button>
      <div class="note">Already have an account? <a onclick="showScreen('login')">Log in</a></div>
      <div id="suStatus" class="status"></div>
    </div>
  </div>

  <div id="login" class="screen">
    <div class="card">
      <div class="field-label">Email</div>
      <input type="text" id="liEmail" placeholder="you@example.com">
      <div class="field-label">Password</div>
      <input type="password" id="liPass" placeholder="Enter your password">

      <button class="btn btn-primary" onclick="handleLogin()">Log In</button>
      <div class="or-divider">or</div>
      <button class="btn-google" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.6-.2-3.1-.9-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.6 26.9 37.5 24 37.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 41 16.2 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.6 5.4c-.5.4 7.4-5.4 7.4-16.5 0-1.6-.2-3.1-.9-4.5z"/></svg>
        Continue with Google
      </button>
      <div class="note">Don't have an account? <a onclick="showScreen('signup')">Sign up</a></div>
      <div id="liStatus" class="status"></div>
    </div>
  </div>

  <div id="welcome" class="screen">
    <div class="card" style="text-align:center;">
      <div style="font-family:'Caveat',cursive; font-size:26px; color:var(--gold-lt);" id="welcomeMsg">Welcome!</div>
      <div class="note" style="margin-top:10px;">You're signed in. <a onclick="handleLogout()">Log out</a></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBqW47mZENA3G-GSy6E9QUZGD0pQdXAKQE",
  authDomain: "tihingi.firebaseapp.com",
  projectId: "tihingi",
  storageBucket: "tihingi.firebasestorage.app",
  messagingSenderId: "163112768310",
  appId: "1:163112768310:web:467c14775943073fd95997",
  measurementId: "G-5ZLGM2ZMNS"
};

let fb = {};
let auth, db;
let currentUser = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setStatus(id, msg, ok){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
}

async function initFirebase(){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
  const authMod = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');
  const fsMod = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
  const app = initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  db = fsMod.getFirestore(app);
  fb = {
    createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
    signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
    onAuthStateChanged: authMod.onAuthStateChanged,
    signOut: authMod.signOut,
    GoogleAuthProvider: authMod.GoogleAuthProvider,
    signInWithRedirect: authMod.signInWithRedirect,
    getRedirectResult: authMod.getRedirectResult,
    doc: fsMod.doc, setDoc: fsMod.setDoc, getDoc: fsMod.getDoc
  };

  // Catch the result of a Google redirect sign-in, if we're returning from one
  try{
    const result = await fb.getRedirectResult(auth);
    if(result && result.user){
      const u = result.user;
      try{
        const snap = await fb.getDoc(fb.doc(db,'users',u.uid));
        if(!snap.exists()) await fb.setDoc(fb.doc(db,'users',u.uid), {name:u.displayName||u.email, email:u.email, createdAt:Date.now()});
      }catch(e){}
    }
  }catch(e){
    setStatus('suStatus', 'Google sign-in failed: ' + firebaseErrorEn(e), false);
    setStatus('liStatus', 'Google sign-in failed: ' + firebaseErrorEn(e), false);
  }

  fb.onAuthStateChanged(auth, async (user)=>{
    if(user){
      let name = user.displayName || user.email;
      try{
        const snap = await fb.getDoc(fb.doc(db,'users',user.uid));
        if(snap.exists()) name = snap.data().name || name;
      }catch(e){}
      currentUser = {uid:user.uid, name, email:user.email};
      document.getElementById('welcomeMsg').textContent = 'Welcome, ' + name + '!';
      showScreen('welcome');
    } else {
      currentUser = null;
    }
  });
}

function firebaseErrorEn(e){
  const code = (e && e.code) || '';
  console.error('Firebase error:', e);
  if(code.includes('email-already-in-use')) return 'This email is already registered.';
  if(code.includes('invalid-email')) return 'That email does not look valid.';
  if(code.includes('weak-password')) return 'Password is too weak.';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('configuration-not-found')) return 'Auth not enabled on Firebase project yet (code: ' + code + ').';
  return (e && e.message) || 'Something went wrong.';
}

async function handleSignup(){
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  const pass2 = document.getElementById('suPass2').value;
  if(!name || !email || !pass){ setStatus('suStatus','Please fill in all fields.',false); return; }
  if(pass.length < 6){ setStatus('suStatus','Password must be at least 6 characters.',false); return; }
  if(pass !== pass2){ setStatus('suStatus','Passwords do not match.',false); return; }
  if(!auth || !fb.createUserWithEmailAndPassword){ setStatus('suStatus','Still connecting to the server — wait a couple seconds and try again.',false); return; }
  setStatus('suStatus','Creating account…', true);
  try{
    const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
    await fb.setDoc(fb.doc(db,'users',cred.user.uid), {name, email, createdAt:Date.now()});
  }catch(e){
    setStatus('suStatus', firebaseErrorEn(e), false);
  }
}
async function handleLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const pass = document.getElementById('liPass').value;
  if(!email || !pass){ setStatus('liStatus','Please enter email and password.',false); return; }
  if(!auth || !fb.signInWithEmailAndPassword){ setStatus('liStatus','Still connecting to the server — wait a couple seconds and try again.',false); return; }
  setStatus('liStatus','Logging in…', true);
  try{
    await fb.signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    setStatus('liStatus', firebaseErrorEn(e), false);
  }
}
async function handleGoogleSignIn(){
  if(!auth || !fb.signInWithRedirect){
    setStatus('suStatus','Still connecting to the server — wait a couple seconds and try again.',false);
    setStatus('liStatus','Still connecting to the server — wait a couple seconds and try again.',false);
    return;
  }
  try{
    const provider = new fb.GoogleAuthProvider();
    await fb.signInWithRedirect(auth, provider);
    // page will navigate away to Google and back — result is handled in initFirebase() on return
  }catch(e){
    setStatus('suStatus', firebaseErrorEn(e), false);
    setStatus('liStatus', firebaseErrorEn(e), false);
  }
}
async function handleLogout(){
  try{ await fb.signOut(auth); showScreen('signup'); }catch(e){}
}

initFirebase().catch(e=>{
  console.error('Firebase failed to load:', e);
  setStatus('suStatus', 'Could not connect to Firebase: ' + (e && e.message ? e.message : e), false);
  setStatus('liStatus', 'Could not connect to Firebase: ' + (e && e.message ? e.message : e), false);
});
</script>
</body>
</html>
